<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Local-first review flow</title>
  <desc id="desc">A Markdown folder is synchronized through ordinary shared storage and reviewed by two clients.</desc>
  <rect width="960" height="260" rx="20" fill="#f3f6fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="75" width="220" height="110" rx="12" fill="#2458a6"/>
    <text x="165" y="120" font-size="22" font-weight="700" fill="white">Markdown folder</text>
    <text x="165" y="151" font-size="15" fill="#dce8fa">.review + documents</text>
    <path d="M285 130 H385" stroke="#667085" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="395" y="75" width="170" height="110" rx="12" fill="#ffffff" stroke="#98a2b3" stroke-width="2"/>
    <text x="480" y="120" font-size="20" font-weight="700" fill="#172033">Shared storage</text>
    <text x="480" y="151" font-size="14" fill="#667085">OneDrive / SMB / Git</text>
    <path d="M575 130 H675" stroke="#667085" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="685" y="40" width="220" height="75" rx="12" fill="#dce8fa" stroke="#2458a6" stroke-width="2"/>
    <text x="795" y="85" font-size="18" font-weight="700" fill="#172033">Reviewer A</text>
    <rect x="685" y="145" width="220" height="75" rx="12" fill="#dce8fa" stroke="#2458a6" stroke-width="2"/>
    <text x="795" y="190" font-size="18" font-weight="700" fill="#172033">Reviewer B</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#667085"/></marker></defs>
</svg>
